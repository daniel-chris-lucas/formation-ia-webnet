<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #333; }
      #app { display: flex; min-height: 100vh; }
      #sidebar { width: 260px; background: #1e293b; color: #fff; padding: 1rem; flex-shrink: 0; }
      #main { flex: 1; padding: 1.5rem; }
      h1 { font-size: 1.2rem; font-weight: 700; color: #94a3b8; margin-bottom: 1.5rem; letter-spacing: 0.05em; text-transform: uppercase; }
      button { cursor: pointer; border: none; border-radius: 4px; padding: 0.4rem 0.8rem; font-size: 0.85rem; }
      input, textarea, select { border: 1px solid #d1d5db; border-radius: 4px; padding: 0.4rem 0.6rem; font-size: 0.9rem; width: 100%; }
      .btn-primary { background: #3b82f6; color: white; }
      .btn-danger { background: #ef4444; color: white; }
      .btn-secondary { background: #e2e8f0; color: #333; }
      .btn-ghost { background: transparent; color: #64748b; text-decoration: underline; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
